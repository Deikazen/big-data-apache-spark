<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Raw Data Tables - Hybrid Spark & Hadoop</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            padding: 20px;
            background: #f4f4f9;
            color: #333;
        }

        .nav {
            margin-bottom: 20px;
        }

        .nav a {
            padding: 10px 15px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .nav a:hover {
            background: #5a6268;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
            max-height: 500px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #007bff;
            color: white;
            position: sticky;
            top: 0;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .badge {
            background: #ffc107;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="nav">
        <a href="/">⬅ Kembali ke Dashboard Analytics</a>
    </div>

    <h2>Tabel Dataset <span id="mode-badge" style="font-size: 0.6em; padding: 4px 10px; border-radius: 6px; background: #e2e8f0; color: #333; vertical-align: middle;">Memuat Mode...</span></h2>

    <!-- Tabel DataFrame -->
    <div class="table-container">
        <h3>Metadata Pasien Kanker (DataFrame) <span class="badge">Preview 100 Baris</span></h3>
        <table id="df-table">
            <thead id="df-head"></thead>
            <tbody id="df-body">
                <tr>
                    <td>Sedang memuat data terstruktur...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Tabel RDD / Text -->
    <div class="table-container">
        <h3>Laporan Patologi (RDD / Text Raw) <span class="badge">Preview 100 Baris</span></h3>
        <table>
            <thead>
                <tr>
                    <th style="width: 50px;">Baris</th>
                    <th>Teks Dokumen (Unstructured Data)</th>
                </tr>
            </thead>
            <tbody id="rdd-body">
                <tr>
                    <td colspan="2">Sedang memuat data teks...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        async function loadModeBadge() {
            try {
                const res = await fetch('/api/mode');
                const json = await res.json();
                const badge = document.getElementById('mode-badge');
                if (badge) {
                    badge.innerText = `Mode: ${json.mode.toUpperCase()} (${json.engine})`;
                    if (json.mode === 'hadoop') {
                        badge.style.background = '#fff3cd';
                        badge.style.color = '#856404';
                        badge.style.border = '1px solid #ffeeba';
                    } else {
                        badge.style.background = '#cce5ff';
                        badge.style.color = '#004085';
                        badge.style.border = '1px solid #b8daff';
                    }
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function fetchDataFrame() {
            try {
                const res = await fetch('/api/patients/all');
                const json = await res.json();

                if (!res.ok || !json.data) throw new Error(json.detail || "Server gagal mengirim data terstruktur");

                const thead = document.getElementById('df-head');
                let headHTML = '<tr>';
                json.columns.forEach(col => { headHTML += `<th>${col}</th>`; });
                headHTML += '</tr>';
                thead.innerHTML = headHTML;

                const tbody = document.getElementById('df-body');
                let bodyHTML = '';
                json.data.forEach(row => {
                    bodyHTML += '<tr>';
                    json.columns.forEach(col => {
                        bodyHTML += `<td>${row[col] !== null ? row[col] : ''}</td>`;
                    });
                    bodyHTML += '</tr>';
                });
                tbody.innerHTML = bodyHTML;
            } catch (error) {
                document.getElementById('df-body').innerHTML = `<tr><td>Error memuat DataFrame: ${error.message}</td></tr>`;
            }
        }

        async function fetchRDD() {
            try {
                const res = await fetch('/api/pathology/all');
                const json = await res.json();

                if (!res.ok || !json.data) throw new Error(json.detail || "Server gagal mengirim data teks");

                const tbody = document.getElementById('rdd-body');
                let bodyHTML = '';
                json.data.forEach((line, index) => {
                    bodyHTML += `<tr>
                                    <td>${index + 1}</td>
                                    <td>${line}</td>
                                 </tr>`;
                });
                tbody.innerHTML = bodyHTML;
            } catch (error) {
                document.getElementById('rdd-body').innerHTML = `<tr><td colspan="2">Error memuat data teks: ${error.message}</td></tr>`;
            }
        }

        window.onload = () => {
            loadModeBadge();
            fetchDataFrame();
            fetchRDD();
        };
    </script>
</body>

</html>
